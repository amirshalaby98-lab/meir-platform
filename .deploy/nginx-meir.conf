server {
    server_name meir.sa 173.249.4.233;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/meir.sa/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/meir.sa/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# Canonical-host redirect: www.meir.sa -> meir.sa (keeps Google OAuth's
# registered redirect_uri single-valued and avoids session/cookie splits
# across the two hostnames).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.meir.sa;

    ssl_certificate /etc/letsencrypt/live/meir.sa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meir.sa/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://meir.sa$request_uri;
}

server {
    if ($host = www.meir.sa) {
        return 301 https://meir.sa$request_uri;
    } # managed by Certbot


    if ($host = meir.sa) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name meir.sa www.meir.sa 173.249.4.233;
    return 404; # managed by Certbot
}
