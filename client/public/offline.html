<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meir - غير متصل</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 500px;
        }

        .icon {
            width: 120px;
            height: 120px;
            margin: 0 auto 30px;
            background: #FFD700;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.3);
        }

        h1 {
            font-size: 32px;
            margin-bottom: 15px;
            color: #FFD700;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
            color: #cccccc;
            margin-bottom: 30px;
        }

        .retry-btn {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #000000;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 5px 20px rgba(255, 215, 0, 0.4);
        }

        .retry-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 215, 0, 0.6);
        }

        .retry-btn:active {
            transform: translateY(0);
        }

        .features {
            margin-top: 40px;
            text-align: right;
        }

        .feature {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            backdrop-filter: blur(10px);
        }

        .feature-title {
            font-weight: bold;
            color: #FFD700;
            margin-bottom: 5px;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        .pulse {
            animation: pulse 2s infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon pulse">
            📡
        </div>
        
        <h1>غير متصل بالإنترنت</h1>
        
        <p>
            يبدو أنك غير متصل بالإنترنت حالياً. يرجى التحقق من اتصالك بالشبكة والمحاولة مرة أخرى.
        </p>

        <button class="retry-btn" onclick="window.location.reload()">
            🔄 إعادة المحاولة
        </button>

        <div class="features">
            <div class="feature">
                <div class="feature-title">✅ الصفحات المحفوظة</div>
                <div>يمكنك تصفح الصفحات التي زرتها سابقاً</div>
            </div>
            
            <div class="feature">
                <div class="feature-title">💾 البيانات المحلية</div>
                <div>بياناتك محفوظة وستُزامن عند الاتصال</div>
            </div>
            
            <div class="feature">
                <div class="feature-title">🔔 التنبيهات</div>
                <div>ستصلك إشعارات عند عودة الاتصال</div>
            </div>
        </div>
    </div>

    <script>
        // Auto-retry when online
        window.addEventListener('online', () => {
            window.location.reload();
        });

        // Check connection status
        setInterval(() => {
            if (navigator.onLine) {
                window.location.reload();
            }
        }, 5000);
    </script>
</body>
</html>
